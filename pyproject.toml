[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "salt-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) Server for SaltStack Master"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
salt-mcp = "salt_mcp.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]
